name: Build LineageOS for Lava Blaze 5G

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Setup environment
      - name: Install Required Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jdk git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip bc libncurses5 curl python-is-python3

      # Sync ROM source
      - name: Initialize and Sync Source
        run: |
          mkdir -p ~/rom
          cd ~/rom
          repo init -u https://github.com/LXX503/android_device_lava_LXX503 -b lineage-22.0 --depth=1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)

      # Build the ROM
      - name: Build ROM
        run: |
          cd ~/rom
          source build/envsetup.sh
          lunch lineage_LXX503-userdebug
          make bacon -j$(nproc)

      # Upload Build Artifacts
      - name: Upload ROM
        uses: actions/upload-artifact@v3
        with:
          name: Lava-Blaze5G-ROM
          path: ~/rom/out/target/product/LXX503/*.zip
