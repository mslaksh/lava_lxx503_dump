name: Build EOS GSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python-is-python3 openjdk-11-jdk wget

      - name: Initialize /e/OS Source
        run: |
          mkdir eos && cd eos
          repo init -u https://gitlab.e.foundation/e/os/android.git -b v2-s
          repo sync -c -j$(nproc --all) --force-sync

      - name: Apply Andy Yan Patches
        run: |
          cd eos
          git clone https://github.com/AndyCGYan/lineage_build_unified -b lineage-20-light patches
          bash patches/apply-patches.sh .

      - name: Build GSI
        run: |
          cd eos
          source build/envsetup.sh
          lunch treble_arm64_bvS-userdebug
          mka systemimage

      - name: Prepare Artifacts
        run: |
          cd eos/out/target/product/treble_arm64_bvS
          mv system.img eos-gsi-arm64-ab.img
          xz -z -9 eos-gsi-arm64-ab.img
          mkdir -p $GITHUB_WORKSPACE/artifacts
          mv *.xz $GITHUB_WORKSPACE/artifacts/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eos-gsi
          path: artifacts/
